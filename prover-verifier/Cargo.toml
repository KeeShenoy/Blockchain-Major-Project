[package]
name = "prover-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
winterfell = { version = "0.13.1", default-features = false, features = ["std"] }
core-utils = { version = "0.13.1", package = "winter-utils", default-features = false, features = ["std"] }
rand-utils = { version = "0.13.1", package = "winter-rand-utils" }
hex = "0.4"

[[bin]]
name = "prover-verifier"
path = "src/main.rs"
